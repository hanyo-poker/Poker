<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poker Notes">
<meta name="theme-color" content="#0d1411">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2313241d'/%3E%3Ctext x='90' y='128' font-size='110' text-anchor='middle' fill='%23e8b84b' font-family='Georgia,serif'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<title>Poker Notes — Tournament Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1411;--bg2:#101a16;--felt:#13241d;--panel:#16221d;--panel2:#1c2a24;
  --line:#2a3a32;--line2:#35463d;--txt:#eef2ee;--dim:#8ea197;--dim2:#62736b;
  --gold:#e8b84b;--gold-d:#b88f2c;--red:#e2614f;--green:#5fc28b;--blue:#62a7d8;--purple:#b58be0;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ui:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:"Fraunces",Georgia,serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--ui);background:radial-gradient(120% 80% at 50% -10%,#1a2e25 0%,var(--bg) 55%,#0a100d 100%);color:var(--txt);overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:1rem}
input,textarea,select{font-family:inherit;font-size:16px}

.head{padding:calc(var(--safe-t) + 12px) 14px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(20,34,28,.6),transparent);position:sticky;top:0;z-index:30;backdrop-filter:blur(8px)}
.head .r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .logo{font-family:var(--disp);font-size:1.3rem;font-weight:600;color:var(--gold);line-height:1}
.brand .sub{font-size:.6rem;color:var(--dim2);letter-spacing:2px;text-transform:uppercase}
.tablechip{font-size:.66rem;color:var(--dim);background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:20px;white-space:nowrap}
.tablechip b{color:var(--gold)}
.head .r2{display:flex;align-items:center;gap:9px;margin-top:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 11px}
.head .r2 .ss-lab{font-size:.66rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
.head .r2 .ss-input{flex:1;background:transparent;border:none;color:var(--txt);font-family:var(--mono);font-weight:700;font-size:.95rem;text-align:right;padding:2px 0}
.head .r2 .ss-input:focus{outline:none}
.head .r3{display:flex;align-items:center;gap:7px;margin-top:7px}
.blindbtn{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;align-items:center;justify-content:center;gap:7px}
.blindbtn .lv{font-family:var(--mono);font-size:.62rem;color:var(--dim2)}
.blindbtn .bl{font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--txt)}
.blindbtn .an{font-family:var(--mono);font-size:.62rem;color:var(--gold)}
.movebtn{background:var(--panel2);border:1px solid var(--line2);color:var(--red);border-radius:10px;padding:7px 11px;font-size:.72rem;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:5px}

.view{flex:1;padding:12px 12px 92px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hide{display:none!important}

.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:10px 15px;border-radius:11px;font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:7px;transition:.12s}
.btn:active{transform:scale(.96)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#1a1306;border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:.78rem;border-radius:9px}
.btn.danger{color:var(--red);border-color:#52302b}
.btn.block{width:100%;justify-content:center;padding:14px}

.handbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:8px}
.handbar .cnt{font-family:var(--mono);font-size:.76rem;color:var(--dim)}
.handbar .cnt b{color:var(--gold);font-size:.95rem}

.streets{display:flex;gap:4px;margin-bottom:11px;background:var(--panel);padding:4px;border-radius:13px;border:1px solid var(--line)}
.streets button{flex:1;padding:8px 3px;border-radius:9px;font-size:.74rem;font-weight:600;color:var(--dim);transition:.12s}
.streets button.on{background:var(--panel2);color:var(--gold)}
.streets button .n{display:block;font-size:.56rem;color:var(--dim2);font-weight:500;margin-top:1px}
.streets button.on .n{color:var(--gold-d)}

.board{display:flex;align-items:center;gap:7px;padding:11px;border-radius:13px;background:radial-gradient(120% 140% at 50% 0%,#1c3328 0%,var(--felt) 70%);border:1px solid var(--line);margin-bottom:11px;min-height:70px}
.board .lbl{font-size:.58rem;color:var(--dim2);text-transform:uppercase;letter-spacing:1.5px;writing-mode:vertical-rl;transform:rotate(180deg)}
.board .cards{display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center}
.board .pot{font-family:var(--mono);font-size:.66rem;color:var(--gold);margin-left:auto;white-space:nowrap}
.board .add{width:40px;height:54px;border-radius:8px;border:1.5px dashed var(--line2);color:var(--dim2);font-size:1.2rem;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.02)}

.pcard{width:40px;height:54px;border-radius:8px;background:#f4f1e8;color:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.4);line-height:1}
.pcard.sm{width:27px;height:38px;border-radius:5px}
.pcard .r{font-size:1rem}.pcard.sm .r{font-size:.72rem}
.pcard .s{font-size:.9rem;margin-top:1px}.pcard.sm .s{font-size:.62rem}
.pcard.s-h{background:#f7dede;color:#c0392b}
.pcard.s-d{background:#dce8f6;color:#2266a3}
.pcard.s-s{background:#e3e6e4;color:#2b332e}
.pcard.s-c{background:#dceada;color:#2e7d4a}
.pcard.mystery{background:#27332c;color:var(--gold);border:1.5px dashed var(--gold-d);font-family:var(--disp)}
.pcard.mystery .r{font-size:1.4rem}
.muckcard{width:40px;height:54px;border-radius:8px;background:repeating-linear-gradient(45deg,#2a1f1a,#2a1f1a 5px,#33261f 5px,#33261f 10px);border:1px solid #46352b;display:flex;align-items:center;justify-content:center;color:#6b5648;font-size:.6rem;font-weight:700}
.muckcard.sm{width:27px;height:38px;font-size:.5rem}

.seats{display:flex;flex-direction:column;gap:7px}
.seat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px 9px 14px;position:relative;overflow:hidden;transition:.13s;text-align:left;display:flex;align-items:center;gap:10px;min-height:58px}
.seat:active{transform:scale(.99)}
.seat .accent{position:absolute;left:0;top:0;bottom:0;width:4px}
.seat.folded{opacity:.42}
.seat.empty{border-style:dashed;color:var(--dim2)}
.seat.acting{box-shadow:0 0 0 1.5px var(--gold)}
.seat .lead{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;width:40px}
.seat .top{display:flex;align-items:center;gap:5px}
.seat .nmwrap{flex:1;min-width:0}
.seat .nm{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .nm.unk{color:var(--dim);font-weight:500}
.seat .seatlabel{font-size:.6rem;color:var(--dim2);font-family:var(--mono);margin-top:1px;text-transform:uppercase;letter-spacing:.5px}
.seat .rightcol{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;max-width:56%}
.snum{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--dim);background:var(--panel2);padding:3px 7px;border-radius:6px;flex-shrink:0}
.pos{font-family:var(--mono);font-size:.55rem;font-weight:700;padding:2px 5px;border-radius:5px;flex-shrink:0;background:var(--panel2);color:var(--dim)}
.pos.btn{background:var(--gold);color:#1a1306}.pos.sb{color:var(--blue)}.pos.bb{color:var(--blue)}
.btnchip{width:16px;height:16px;border-radius:50%;background:#f4f1e8;color:#1a1306;font-size:.5rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.seat .hero{font-size:.55rem;color:var(--gold);border:1px solid var(--gold-d);padding:0 4px;border-radius:4px;flex-shrink:0}
.seat .chips{font-family:var(--mono);font-size:.82rem;color:var(--txt);white-space:nowrap}
.seat .chips .bb{color:var(--green);font-size:.66rem}
.seat .ministat{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;font-family:var(--mono);font-size:.6rem;color:var(--dim2)}
.seat .ministat b{color:var(--dim);font-weight:700}
.seat .acts{display:flex;flex-wrap:wrap;gap:3px;min-height:18px;justify-content:flex-end}
.tag{font-family:var(--mono);font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--panel2);color:var(--dim);border:1px solid var(--line2)}
.tag.call{color:var(--blue)}.tag.raise,.tag.bet{color:var(--gold)}
.tag.threebet,.tag.fourbet{color:var(--red);border-color:#52302b}
.tag.blind,.tag.ante{color:var(--dim2);opacity:.8}
.tag.fold{color:var(--dim2)}.tag .amt{color:var(--txt);opacity:.85}
.seat.empty .plus{font-size:1.3rem;color:var(--gold)}
.seat.empty .lab{font-size:.78rem;color:var(--gold)}
.win-badge{position:absolute;top:5px;right:8px;font-size:.52rem;background:var(--gold);color:#1a1306;font-weight:700;padding:1px 5px;border-radius:5px}
.btnbar{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 11px;margin-bottom:10px;flex-wrap:wrap}
.btnbar .bl{font-size:.74rem;font-weight:600}
.btnbar .bseat{font-family:var(--mono);font-weight:700;color:var(--gold);font-size:.82rem}
.btnbar .hint{font-size:.62rem;color:var(--dim2);margin-left:auto}
.dtog{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);color:var(--dim2);font-size:.58rem;font-weight:700;font-family:var(--mono);display:flex;align-items:center;justify-content:center;background:transparent}
.dtog.on{background:#f4f1e8;color:#1a1306;border-color:#f4f1e8;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.flow-prog{font-size:.72rem;color:var(--gold);font-weight:600;margin-bottom:8px}
.flow-cur{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:10px;min-height:24px}
.mini-clear{font-size:.64rem;color:var(--red);background:transparent;border:1px solid #52302b;border-radius:6px;padding:2px 7px}
.flow-nav{display:flex;gap:8px;margin-top:12px}
.flow-nav .btn{flex:1;justify-content:center}
.flow-info{font-size:.74rem;color:var(--dim);font-family:var(--mono);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:9px}
.flow-info b{color:var(--gold);font-weight:700}
.amt-label{font-size:.64rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.actgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.actgrid2 .actbtn.fold{grid-column:span 2}
.flow-done{text-align:center;padding:14px 8px 18px}
.flow-done .big{font-family:var(--disp);font-size:1.5rem;font-weight:600;color:var(--gold)}
.flow-done .who{font-size:.86rem;color:var(--txt);margin-top:6px}
.flow-done .pot{font-family:var(--mono);font-size:.78rem;color:var(--dim);margin-top:8px}
.be-prev{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:.7rem;color:var(--dim2);margin-bottom:10px}
.statline.g8{display:grid;grid-template-columns:repeat(4,1fr);gap:5px 2px}
.statline.g8 .v{font-size:.82rem}
.statline.g8 .k{font-size:.5rem}
.bio{font-size:.6rem;color:var(--dim2);background:var(--panel2);border:1px solid var(--line2);padding:1px 6px;border-radius:5px}
.pickrow{display:flex;gap:6px;flex-wrap:wrap}
.pickrow button{flex:1;min-width:60px;padding:10px 6px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);color:var(--dim);font-weight:600;font-size:.82rem}
.pickrow button.sel{background:var(--gold);color:#1a1306;border-color:var(--gold)}

.empty-note{text-align:center;color:var(--dim2);padding:34px 18px;font-size:.88rem;line-height:1.7}
.empty-note .big{font-family:var(--disp);font-size:1.2rem;color:var(--dim);display:block;margin-bottom:7px}

.section-h{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 11px}
.section-h h2{font-family:var(--disp);font-weight:600;font-size:1.2rem;margin:0}
.plist{display:flex;flex-direction:column;gap:8px}
.pcardrow{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 13px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;text-align:left}
.pcardrow:active{transform:scale(.99)}
.pcardrow.arch{opacity:.62}
.pcardrow .accent{position:absolute;left:0;top:0;bottom:0;width:4px}
.pcardrow .hd{display:flex;align-items:center;gap:7px}
.pcardrow .hd .nm{font-weight:600;font-size:1rem}
.pcardrow .hd .tagmini{margin-left:auto;font-size:.58rem;color:var(--dim2);font-family:var(--mono)}
.favstar{font-size:1.05rem;color:var(--dim2);line-height:1;padding:2px 4px;margin:-2px 2px -2px -2px;flex-shrink:0}
.favstar.on{color:var(--gold)}
.statline{display:flex}
.stat{flex:1;text-align:center;padding:2px}
.stat .v{font-family:var(--mono);font-weight:700;font-size:.98rem}
.stat .k{font-size:.55rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.stat .v.hot{color:var(--red)}.stat .v.warm{color:var(--gold)}.stat .v.cool{color:var(--blue)}
.note-prev{font-size:.76rem;color:var(--dim);line-height:1.5;border-left:2px solid var(--line2);padding-left:8px}

.detail-hd{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.back{font-size:1.4rem;color:var(--dim);padding:4px 8px;margin-left:-8px}
.detail-hd h2{font-family:var(--disp);font-weight:600;font-size:1.3rem;margin:0;flex:1}
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.bigstat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 8px;text-align:center}
.bigstat .v{font-family:var(--mono);font-weight:700;font-size:1.4rem}
.bigstat .k{font-size:.58rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px}
.panel h3{font-size:.68rem;text-transform:uppercase;letter-spacing:1.1px;color:var(--dim2);margin:0 0 10px}
textarea.notes{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;color:var(--txt);padding:11px;resize:vertical;min-height:78px;line-height:1.6}
.shown-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.shown-row:last-child{border:none}
.shown-row .meta{flex:1;font-size:.78rem;color:var(--dim)}
.shown-row .meta .when{font-family:var(--mono);font-size:.6rem;color:var(--dim2)}

.histrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;text-align:left;width:100%}
.histrow .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.histrow .when{font-family:var(--mono);font-size:.64rem;color:var(--dim2)}
.histrow .pot{font-family:var(--mono);font-size:.7rem;color:var(--gold)}
.histrow .board-mini{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.sd{display:flex;flex-direction:column;gap:5px}
.sd-item{display:flex;align-items:center;gap:7px;font-size:.78rem}
.sd-item .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sd-item .cc{display:flex;gap:3px}
.sd-item .wn{font-size:.55rem;background:var(--gold);color:#1a1306;font-weight:700;padding:0 4px;border-radius:4px}
.note-line{font-size:.74rem;color:var(--dim);font-style:italic;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}

.field{margin-bottom:13px}
.field label{display:block;font-size:.7rem;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field textarea,.field select{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;color:var(--txt);padding:11px}
.row2{display:flex;gap:9px}.row2>*{flex:1}.row3{display:flex;gap:8px}.row3>*{flex:1}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;display:flex;background:rgba(16,26,22,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe-b))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim2);padding:5px;font-size:.6rem;font-weight:600;transition:.12s}
.nav button.on{color:var(--gold)}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button.on svg{stroke-width:2.1}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.overlay.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:560px;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line2);padding:16px 14px calc(16px + var(--safe-b));animation:slideup .24s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow-y:auto}
.overlay.center .sheet{border-radius:18px;animation:pop .18s;max-height:86vh}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.sheet .sh-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sheet .sh-hd h3{margin:0;font-family:var(--disp);font-size:1.15rem;font-weight:600}
.sheet .sh-hd .close{font-size:1.5rem;color:var(--dim);padding:0 4px}
.grip{width:38px;height:4px;background:var(--line2);border-radius:3px;margin:-4px auto 12px}

.menu-btn{width:100%;text-align:left;padding:14px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:11px;font-size:.92rem}
.menu-btn .ic{font-size:1.1rem;width:22px;text-align:center}
.menu-btn.danger{color:var(--red)}
.menu-btn.is-disabled{opacity:.4;pointer-events:none}
.menu-btn .desc{display:block;font-size:.68rem;color:var(--dim2);font-weight:400;margin-top:1px}

.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.actbtn{padding:14px 8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-weight:700;font-size:.95rem;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.12s}
.actbtn:active{transform:scale(.95)}
.actbtn .en{font-size:.58rem;color:var(--dim2);font-weight:500}
.actbtn.fold{color:var(--dim);grid-column:span 2}
.actbtn.call{color:var(--blue)}.actbtn.raise,.actbtn.bet{color:var(--gold)}
.actbtn.threebet,.actbtn.fourbet{color:var(--red)}.actbtn.check{color:var(--txt)}
.amtdisp{font-family:var(--mono);font-size:1.7rem;font-weight:700;text-align:center;color:var(--gold);background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:11px;margin-bottom:8px;width:100%;display:block}
input.amtdisp{-webkit-appearance:none;appearance:none}
input.amtdisp:focus{outline:none;border-color:var(--gold-d)}
input.amtdisp::placeholder{color:var(--dim2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{padding:8px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);font-family:var(--mono);font-weight:700;font-size:.78rem}
.chip:active{transform:scale(.94)}
.chip.clear{color:var(--red)}

.rankgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:11px}
.rankgrid button{padding:11px 0;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);font-family:var(--mono);font-weight:700;font-size:.95rem}
.rankgrid button.sel{background:var(--gold);color:#1a1306;border-color:var(--gold)}
.suitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}
.suitgrid button{padding:15px 0;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);font-size:1.5rem}
.suitgrid button.s-h{color:#e2614f}.suitgrid button.s-d{color:#62a7d8}.suitgrid button.s-s{color:#c5ccc8}.suitgrid button.s-c{color:#5fc28b}
.suitgrid button.sel{background:#f4f1e8;box-shadow:0 0 0 2px var(--gold)}
.suitgrid button.sel.s-h{background:#f7dede}.suitgrid button.sel.s-d{background:#dce8f6}.suitgrid button.sel.s-s{background:#e3e6e4}.suitgrid button.sel.s-c{background:#dceada}
.picked{display:flex;gap:7px;justify-content:center;min-height:56px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.sdmode{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.sdmode button{padding:12px 6px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);font-weight:600;font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:3px}
.sdmode button.sel{box-shadow:0 0 0 2px var(--gold)}
.sdmode button .sm-ic{font-size:1.2rem}

.winpick{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.winrow{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2)}
.winrow.sel{box-shadow:0 0 0 2px var(--gold);background:var(--panel)}
.winrow .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.winrow .nm{flex:1;font-weight:600}
.winrow .inv{font-family:var(--mono);font-size:.7rem;color:var(--dim2)}
.winrow .chk{font-size:1rem;color:var(--gold)}

.sess-row{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px}
.rec-badge{font-size:.62rem;font-weight:700;color:var(--green);border:1px solid var(--green);border-radius:20px;padding:2px 9px;white-space:nowrap;flex-shrink:0}
.del-x{font-size:.66rem;color:var(--red);background:transparent;border:1px solid #52302b;border-radius:7px;padding:5px 10px;flex-shrink:0}
.pl{font-family:var(--mono);font-weight:700}.pl.pos{color:var(--green)}.pl.neg{color:var(--red)}
.legend{font-size:.66rem;color:var(--dim2);line-height:1.7;margin-top:4px}
.legend b{color:var(--dim)}.muted{color:var(--dim2)}
hr.sep{border:none;border-top:1px solid var(--line);margin:15px 0}
.toast{position:fixed;bottom:calc(84px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);padding:10px 17px;border-radius:30px;font-size:.84rem;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .3s;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.sortbar{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.sortbar button{font-size:.7rem;padding:6px 11px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:var(--dim)}
.sortbar button.on{background:var(--panel2);color:var(--gold);border-color:var(--gold-d)}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="r1">
      <div class="brand"><span class="logo">Poker Notes</span><span class="sub">Tourney</span></div>
      <button class="tablechip" id="tableInfo"></button>
    </div>
    <div class="r2">
      <span class="ss-lab">初期スタック</span>
      <input class="ss-input" id="startStackInput" type="number" inputmode="numeric">
    </div>
    <div class="r3">
      <button class="blindbtn" id="blindBtn"></button>
      <button class="movebtn" id="moveBtn">⇄ テーブル移動</button>
    </div>
  </div>
  <div id="view" class="view"></div>
  <nav class="nav" id="nav">
    <button data-tab="table" class="on"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg><span>テーブル</span></button>
    <button data-tab="analysis"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="8" width="3" height="9"/><rect x="17" y="13" width="3" height="4"/></svg><span>分析</span></button>
    <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg><span>履歴</span></button>
    <button data-tab="data"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span>設定</span></button>
  </nav>
</div>

<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SUITS={s:{ch:'♠',red:false},h:{ch:'♥',red:true},d:{ch:'♦',red:true},c:{ch:'♣',red:false}};
const RANKS=['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
const STREETS=[['preflop','pf','プリフロップ','PF'],['flop','fl','フロップ','Flop'],['turn','tn','ターン','Turn'],['river','rv','リバー','River'],['showdown','sd','ショーダウン','SD']];
const PCOLORS=['#e8b84b','#62a7d8','#5fc28b','#e2614f','#b58be0','#e09a5f','#5fc2bf','#d86fa8','#9db85f','#7f8ce0'];
const ACTIONS={check:{ja:'チェック',en:'Check'},call:{ja:'コール',en:'Call/Limp'},bet:{ja:'ベット',en:'Bet'},raise:{ja:'レイズ',en:'Raise/Open'},threebet:{ja:'3ベット',en:'3-Bet'},fourbet:{ja:'4ベット+',en:'4-Bet+'},fold:{ja:'フォールド',en:'Fold'}};
const PF_ACTS=['call','raise','threebet','fourbet','check','fold'];
const POST_ACTS=['check','bet','call','raise','fold'];
const VOL=['call','bet','raise','threebet','fourbet'];
const POS={2:['SB','BB'],3:['BTN','SB','BB'],4:['BTN','SB','BB','CO'],5:['BTN','SB','BB','UTG','CO'],6:['BTN','SB','BB','UTG','HJ','CO'],7:['BTN','SB','BB','UTG','MP','HJ','CO'],8:['BTN','SB','BB','UTG','UTG1','MP','HJ','CO'],9:['BTN','SB','BB','UTG','UTG1','MP','LJ','HJ','CO']};
// レベル: [SB, BB, BB-Ante]（添付ストラクチャー）
const LEVELS={1:[100,200,200],2:[200,300,300],3:[200,400,400],4:[300,600,600],5:[400,800,800],6:[500,1000,1000],7:[600,1200,1200],8:[1000,1500,1500],9:[1000,2000,2000],10:[1500,3000,3000],11:[2000,4000,4000],12:[3000,6000,6000],13:[4000,8000,8000],14:[5000,10000,10000],15:[6000,12000,12000],16:[10000,15000,15000],17:[10000,20000,20000],18:[15000,30000,30000],19:[20000,40000,40000],20:[30000,60000,60000],21:[40000,80000,80000],22:[50000,100000,100000],23:[60000,120000,120000],24:[75000,150000,150000],25:[100000,200000,200000],26:[150000,300000,300000],27:[200000,400000,400000],28:[300000,600000,600000],29:[400000,800000,800000],30:[500000,1000000,1000000]};
const MAXLV=30;

const KEY='pokernotes_v2';
function blank(){return{
  v:2,
  settings:{seatCount:9,sb:100,bb:200,ante:200,startStack:20000,heroSeat:1,autoBlind:true},
  tableNo:1,level:1,buttonSeat:1,
  seats:[],players:{},hands:[],draft:null,
  tournaments:[],activeTournament:null,
  ui:{tab:'table',street:'preflop',filter:null,sort:'seat',detail:null,showArch:false}
};}
let S=blank();let storageOK=true;

function ensureSeats(){
  const n=S.settings.seatCount;
  if(!Array.isArray(S.seats))S.seats=[];
  // keep existing, resize
  const cur=S.seats.slice(0,n);
  for(let i=cur.length;i<n;i++)cur.push({seat:i+1,playerId:null});
  cur.forEach((s,i)=>s.seat=i+1);
  S.seats=cur;
}

async function load(){
  try{
    let raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
    if(!raw&&window.storage){const r=await window.storage.get(KEY);if(r&&r.value)raw=r.value;}
    if(raw)S=Object.assign(blank(),JSON.parse(raw));
    S.ui=Object.assign({tab:'table',street:'preflop',filter:null,sort:'seat',detail:null,showArch:false},S.ui||{});
  }catch(e){storageOK=false;}
  ensureSeats();
}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{
  const data=JSON.stringify(S);let ok=false;
  try{localStorage.setItem(KEY,data);ok=true;}catch(e){}
  if(!ok&&window.storage){try{await window.storage.set(KEY,data);ok=true;}catch(e){}}
  storageOK=ok;
},150);}

/* ---- seat / player helpers ---- */
function seatObj(n){return S.seats.find(s=>s.seat===n);}
function playerOf(n){const s=seatObj(n);return s&&s.playerId?S.players[s.playerId]:null;}
function occupiedSeats(){return S.seats.filter(s=>s.playerId).map(s=>s.seat).sort((a,b)=>a-b);}
// 着席者をボタンから時計回りに並べた配列 [BTN, SB, BB, UTG, ...]
function orderFromButton(){
  const occ=occupiedSeats();const n=occ.length;if(n<2)return[];
  let bi=occ.indexOf(S.buttonSeat);
  if(bi<0){bi=0;let best=Infinity;occ.forEach((s,i)=>{const d=(s-S.buttonSeat+S.settings.seatCount)%S.settings.seatCount;if(d<best){best=d;bi=i;}});}
  const arr=[];for(let i=0;i<n;i++)arr.push(occ[(bi+i)%n]);return arr;
}
function positionMap(){
  const fb=orderFromButton();const n=fb.length;const map={};
  if(n<2)return map;
  const names=POS[Math.min(n,9)]||POS[9];
  fb.forEach((s,i)=>map[s]=names[i]||('P'+i));
  return map;
}
function blindSeats(){
  const fb=orderFromButton();const n=fb.length;if(n<2)return{};
  if(n===2)return{sb:fb[0],bb:fb[1]}; // HU: ボタン=SB
  return{sb:fb[1],bb:fb[2]};
}
function nextOccAfter(seat){
  const occ=occupiedSeats();if(!occ.length)return seat;
  for(let i=1;i<=S.settings.seatCount;i++){const c=((seat-1+i)%S.settings.seatCount)+1;if(occ.includes(c))return c;}
  return occ[0];
}
function prevOccBefore(seat){
  const occ=occupiedSeats();if(!occ.length)return seat;
  for(let i=1;i<=S.settings.seatCount;i++){const c=((seat-1-i+S.settings.seatCount*2)%S.settings.seatCount)+1;if(occ.includes(c))return c;}
  return occ[0];
}
function stackOf(p){return p.stack==null?S.settings.startStack:p.stack;}

/* ---- stats ---- */
function streetActs(hp,k){return (hp&&hp[k])?hp[k]:[];}
function handSeatOf(h,pid){for(const k in h.seats)if(h.seats[k].playerId===pid)return h.seats[k];return null;}
function seatNumOf(h,pid){for(const k in h.seats)if(h.seats[k].playerId===pid)return +k;return null;}
// 順序付きログ(seq)から、対3betとフロップCBの判定メタを返す
function handMeta(h){
  if(!h.seq||!h.seq.pf)return null;
  const pf=h.seq.pf;
  let openerSeat=null,openerIdx=-1;
  for(let i=0;i<pf.length;i++){if(pf[i].a==='raise'){openerSeat=pf[i].s;openerIdx=i;break;}}
  let tbIdx=-1;
  if(openerSeat!=null)for(let i=openerIdx+1;i<pf.length;i++){if(pf[i].a==='threebet'){tbIdx=i;break;}}
  let faced3=false,openerFolded=false;
  if(openerSeat!=null&&tbIdx>=0){faced3=true;for(let i=tbIdx+1;i<pf.length;i++){if(pf[i].s===openerSeat){openerFolded=(pf[i].a==='fold');break;}}}
  let aggrSeat=null;
  for(const e of pf)if(['raise','threebet','fourbet'].includes(e.a))aggrSeat=e.s;
  const sawFlop=(h.board.flop&&h.board.flop.length>0)||(h.seq.fl&&h.seq.fl.length>0);
  let aggrBetFlop=false;
  if(aggrSeat!=null&&h.seq.fl)aggrBetFlop=h.seq.fl.some(e=>e.s===aggrSeat&&e.a==='bet');
  return{openerSeat,faced3,openerFolded,aggrSeat,sawFlop,aggrBetFlop};
}
function computeStats(pid){
  let dealt=0,vpip=0,pfr=0,threeb=0,agg=0,callsP=0,wtsd=0,shown=0,muck=0;
  let f3d=0,f3n=0,cbd=0,cbn=0;
  for(const h of S.hands){
    const hp=handSeatOf(h,pid);if(!hp)continue;dealt++;
    const myseat=seatNumOf(h,pid);
    const pf=streetActs(hp,'pf');
    if(pf.some(a=>VOL.includes(a.a)))vpip++;
    if(pf.some(a=>['raise','threebet','fourbet'].includes(a.a)))pfr++;
    if(pf.some(a=>['threebet','fourbet'].includes(a.a)))threeb++;
    for(const k of ['fl','tn','rv'])for(const a of streetActs(hp,k)){if(a.a==='bet'||a.a==='raise')agg++;else if(a.a==='call')callsP++;}
    const reached=!hp.folded&&(h.board.river.length>0||Object.values(h.seats).some(x=>x.shown&&(x.shown.cards.length||x.shown.mystery||x.shown.muck)));
    if(reached)wtsd++;
    if(hp.shown){if(hp.shown.cards.length||hp.shown.mystery)shown++;if(hp.shown.muck)muck++;}
    const meta=handMeta(h);
    if(meta){
      if(meta.faced3&&meta.openerSeat===myseat){f3d++;if(meta.openerFolded)f3n++;}
      if(meta.aggrSeat===myseat&&meta.sawFlop){cbd++;if(meta.aggrBetFlop)cbn++;}
    }
  }
  const pct=n=>dealt?Math.round(n/dealt*100):0;
  const af=callsP?agg/callsP:(agg>0?agg:0);
  return{dealt,vpip:pct(vpip),pfr:pct(pfr),threeb:pct(threeb),af,afRaw:callsP===0&&agg>0,wtsd:pct(wtsd),shown,muck,
    fto3:f3d?Math.round(f3n/f3d*100):null,fto3n:f3d,
    flopcb:cbd?Math.round(cbn/cbd*100):null,flopcbn:cbd};
}

/* ---- chip math ---- */
function investedInDraft(d,seat){let t=0;const hp=d.seats[seat];if(!hp)return 0;for(const k of ['pf','fl','tn','rv'])for(const a of streetActs(hp,k))t+=(+a.amt||0);return t;}
function potOfDraft(d){let t=0;for(const s in d.seats)t+=investedInDraft(d,+s);return t;}
function potOfHand(h){let t=0;for(const s in h.seats){const hp=h.seats[s];for(const k of ['pf','fl','tn','rv'])for(const a of streetActs(hp,k))t+=(+a.amt||0);}return t;}

/* ============ render ============ */
const view=$('#view');
function render(){
  ensureSeats();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.ui.tab));
  // header
  $('#tableInfo').innerHTML='Table <b>'+S.tableNo+'</b> · '+occupiedSeats().length+'/'+S.settings.seatCount+'人';
  const st=S.settings;
  const ssIn=$('#startStackInput');if(ssIn&&document.activeElement!==ssIn)ssIn.value=st.startStack;
  $('#blindBtn').innerHTML='<span class="lv">Lv'+S.level+'</span><span class="bl">'+fmtN(st.sb)+' / '+fmtN(st.bb)+'</span>'+(st.ante>0?'<span class="an">ante '+fmtN(st.ante)+'</span>':'');
  if(S.ui.tab==='table')renderTable();
  else if(S.ui.tab==='analysis')S.ui.detail?renderDetail():renderAnalysis();
  else if(S.ui.tab==='history')renderHistory();
  else if(S.ui.tab==='data')renderData();
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtN(n){return (+n||0).toLocaleString();}
function fmtAmt(n){if(n==null||n==='')return'';return (+n).toLocaleString();}
function bbOf(stack){const bb=+S.settings.bb||1;return Math.floor(stack/bb);}
function cardHTML(c,sm){
  if(!c)return'';
  if(c==='?')return '<div class="pcard mystery'+(sm?' sm':'')+'"><span class="r">?</span></div>';
  if(c==='muck')return '<div class="muckcard'+(sm?' sm':'')+'">MUCK</div>';
  const r=c[0],su=c[1],info=SUITS[su]||{ch:'?'};
  return '<div class="pcard s-'+su+(sm?' sm':'')+'"><span class="r">'+r+'</span><span class="s">'+info.ch+'</span></div>';
}
function actTag(a){return{check:'CHK',call:'CALL',bet:'BET',raise:'RAISE',threebet:'3BET',fourbet:'4BET',fold:'FOLD',blind:'BLIND',ante:'ANTE'}[a]||a.toUpperCase();}

/* ----- TABLE TAB ----- */
function renderTable(){
  const occ=occupiedSeats();
  let h='';
  if(!S.draft){
    h+='<div class="handbar"><span class="cnt">次のハンド <b>#'+(S.hands.length+1)+'</b></span>';
    h+='<button class="btn gold sm" id="startHand"'+(occ.length<2?' disabled style="opacity:.45"':'')+'>＋ ハンド開始</button></div>';
    if(occ.length<2)h+='<div class="muted" style="font-size:.74rem;text-align:center;margin:-4px 0 10px">2人以上着席するとハンドを記録できます</div>';
    if(occ.length>=2){
      h+='<div class="btnbar"><span class="bl">🔘 ディーラーボタン</span>'
        +'<button class="btn sm ghost" data-btnmove="prev">◀</button>'
        +'<span class="bseat">Seat '+S.buttonSeat+'</span>'
        +'<button class="btn sm ghost" data-btnmove="next">▶</button>'
        +'<span class="hint">各席のDを押しても移動</span></div>';
    }
    h+=seatGrid('manage');
    const last=S.hands[0];
    if(last)h+='<div style="margin-top:16px"><div class="section-h"><h2 style="font-size:.95rem">直近のハンド</h2></div>'+histRowHTML(last)+'</div>';
    view.innerHTML=h;return;
  }
  const d=S.draft;
  h+='<div class="handbar"><span class="cnt">記録中 <b>#'+(S.hands.length+1)+'</b></span>'
    +'<div style="display:flex;gap:7px"><button class="btn ghost sm" id="cancelHand">破棄</button>'
    +'<button class="btn gold sm" id="commitHand">✓ 保存</button></div></div>';
  h+='<div class="streets">';
  for(const[full,key,ja,short]of STREETS)h+='<button data-street="'+full+'" class="'+(S.ui.street===full?'on':'')+'">'+short+'<span class="n">'+ja+'</span></button>';
  h+='</div>';
  if(S.ui.street!=='preflop'){
    const allB=[...d.board.flop,...d.board.turn,...d.board.river];
    h+='<div class="board"><span class="lbl">Board</span><div class="cards">';
    for(const c of allB)h+=cardHTML(c);
    h+='<button class="add" id="editBoard">'+(allB.length?'✎':'＋')+'</button>';
    h+='</div><span class="pot">POT '+fmtN(potOfDraft(d))+'</span></div>';
  }
  h+=seatGrid(S.ui.street==='showdown'?'showdown':'hand');
  if(S.ui.street==='showdown')h+='<button class="btn gold block" id="commitHand2" style="margin-top:12px">✓ このハンドを保存</button>';
  else if(d.actor!=null&&playerOf(d.actor)){const ap=playerOf(d.actor);h+='<button class="btn gold block" id="resumeFlow" style="margin-top:12px">▶ 続けて入力（Seat '+d.actor+' / '+esc(ap.name||'Unknown')+'）</button>';}
  view.innerHTML=h;
}

function seatGrid(mode){
  const pm=positionMap();const hero=S.settings.heroSeat;
  let h='<div class="seats">';
  for(const s of S.seats){
    const p=s.playerId?S.players[s.playerId]:null;
    const seatN=s.seat;
    const pos=pm[seatN];const isBtn=S.buttonSeat===seatN&&occupiedSeats().length>=2;
    if(!p){
      h+='<button class="seat empty" data-seat="'+seatN+'" data-mode="'+mode+'">'
        +'<div class="lead"><span class="snum">'+seatN+'</span></div>'
        +'<div class="nmwrap"><div class="nm" style="color:var(--dim2)">空席</div><div class="seatlabel">Seat '+seatN+'</div></div>'
        +'<div class="rightcol"><span class="lab">＋ '+(mode==='manage'?'着席':'空席')+'</span></div></button>';
      continue;
    }
    const st=computeStats(p.id);
    let cls='seat';let hp=null;
    if(S.draft){hp=S.draft.seats[seatN];if(hp&&hp.folded)cls+=' folded';if(mode!=='manage'&&S.draft.actor===seatN)cls+=' acting';}
    h+='<button class="'+cls+'" data-seat="'+seatN+'" data-mode="'+mode+'">';
    h+='<span class="accent" style="background:'+p.color+'"></span>';
    if(S.draft&&S.draft.winners&&S.draft.winners.includes(seatN))h+='<span class="win-badge">WON</span>';
    // lead column: seat number + position / dealer toggle
    h+='<div class="lead"><span class="snum">'+seatN+'</span>';
    if(mode==='manage'){
      h+='<span class="dtog'+(isBtn?' on':'')+'" data-setbtn="'+seatN+'">D</span>';
    }else{
      if(pos)h+='<span class="pos '+(pos==='BTN'?'btn':pos==='SB'?'sb':pos==='BB'?'bb':'')+'">'+pos+'</span>';
      else if(isBtn)h+='<span class="btnchip">D</span>';
    }
    h+='</div>';
    const unk=(p.name==='Unknown'||!p.name);
    h+='<div class="nmwrap"><div class="nm'+(unk?' unk':'')+'">'+esc(p.name||'Unknown')+((p.hero||hero===seatN)?' <span class="hero">YOU</span>':'')+'</div>'
      +'<div class="seatlabel">Seat '+seatN+(pos&&mode==='manage'?' · '+pos:'')+'</div></div>';
    h+='<div class="rightcol">';
    h+='<div class="chips">'+fmtN(stackOf(p))+' <span class="bb">'+bbOf(stackOf(p))+'BB</span></div>';
    if(mode==='manage'){
      h+='<div class="ministat"><span>VP<b> '+st.vpip+'</b></span><span>PFR<b> '+st.pfr+'</b></span><span>AF<b> '+(st.afRaw?'('+st.af+')':st.af.toFixed(1))+'</b></span><span>n<b> '+st.dealt+'</b></span></div>';
    }else if(mode==='showdown'){
      const sh=hp&&hp.shown?hp.shown:null;
      h+='<div class="acts">';
      if(sh&&sh.muck)h+=cardHTML('muck',true);
      else if(sh&&sh.mystery)h+=cardHTML('?',true);
      else if(sh&&sh.cards.length)for(const c of sh.cards)h+=cardHTML(c,true);
      else if(hp&&hp.folded)h+='<span class="tag fold">降りた</span>';
      else h+='<span class="tag" style="opacity:.5">記録 ＋</span>';
      h+='</div>';
      if(sh&&sh.note)h+='<div class="ministat" style="color:var(--dim)">"'+esc(sh.note)+'"</div>';
    }else{
      const acts=hp?streetActs(hp,STREETS.find(x=>x[0]===S.ui.street)[1]):[];
      h+='<div class="acts">';
      if(hp&&hp.folded&&acts.filter(a=>a.a!=='blind'&&a.a!=='ante').length===0&&!acts.some(a=>a.a==='fold'))h+='<span class="tag fold">FOLD</span>';
      else if(acts.length===0)h+='<span class="tag" style="opacity:.4">タップ</span>';
      else for(const a of acts)h+='<span class="tag '+a.a+'">'+actTag(a.a)+(a.amt?' <span class="amt">'+fmtN(a.amt)+'</span>':'')+'</span>';
      h+='</div>';
    }
    h+='</div></button>';
  }
  h+='</div>';
  return h;
}

/* ----- ANALYSIS TAB ----- */
function renderAnalysis(){
  const seated=occupiedSeats().map(playerOf).filter(Boolean);
  const seatedIds=seated.map(p=>p.id);
  const arch=Object.values(S.players).filter(p=>!seatedIds.includes(p.id));
  let h='<div class="section-h"><h2>分析</h2><span class="muted" style="font-size:.74rem">'+seated.length+'人 着席中</span></div>';
  h+='<div class="sortbar">'
    +sortB('seat','席順')+sortB('vpip','VPIP')+sortB('pfr','PFR')+sortB('dealt','ハンド数')+'</div>';
  let list=seated.slice();
  list=sortPlayers(list);
  if(list.length===0)h+='<div class="empty-note">着席しているプレイヤーがいません。<br>「テーブル」タブで空席をタップして着席させましょう。</div>';
  else{h+='<div class="plist">';for(const p of list)h+=playerRow(p,false);h+='</div>';}
  if(arch.length){
    const nonFav=arch.filter(p=>!p.fav&&!p.hero).length;
    h+='<div class="section-h" style="margin-top:18px"><h2 style="font-size:1rem">過去のプレイヤー ('+arch.length+')</h2>'
      +'<button class="btn ghost sm" id="toggleArch">'+(S.ui.showArch?'隠す':'表示')+'</button></div>';
    if(S.ui.showArch){
      const sorted=sortPlayers(arch).sort((a,b)=>(b.fav?1:0)-(a.fav?1:0));
      h+='<div class="plist">';for(const p of sorted)h+=playerRow(p,true);h+='</div>';
      h+='<button class="btn danger block" id="bulkDelArch" style="margin-top:10px"'+(nonFav===0?' disabled style="opacity:.4"':'')+'>★お気に入り以外をまとめて削除（'+nonFav+'人）</button>';
      h+='<div class="muted" style="font-size:.72rem;margin-top:8px">※ ★を付けた人は残ります。過去のプレイヤーは「テーブル」の空席→「過去から選択」で再着席でき、スタッツを引き継げます。</div>';
    }
  }
  h+='<div class="legend" style="margin-top:14px"><b>VPIP</b>自発参加率 / <b>PFR</b>レイズ率 / <b>3B</b>3ベット率 / <b>Fto3</b>対3ベットフォールド率 / <b>FlpCB</b>フロップCベット率 / <b>AF</b>アグレッション / <b>WTSD</b>SD到達率 / <b>N</b>ハンド数<br>Fto3・FlpCBは順繰り入力したハンドのみ集計。「–」はサンプル不足。</div>';
  view.innerHTML=h;
}
function sortB(k,lab){return '<button data-sort="'+k+'" class="'+(S.ui.sort===k?'on':'')+'">'+lab+'</button>';}
function sortPlayers(arr){
  const k=S.ui.sort;
  return arr.slice().sort((a,b)=>{
    if(k==='seat')return (a.lastSeat||99)-(b.lastSeat||99);
    const sa=computeStats(a.id),sb=computeStats(b.id);
    if(k==='dealt')return sb.dealt-sa.dealt;
    return (sb[k]||0)-(sa[k]||0);
  });
}
function playerRow(p,arch){
  const st=computeStats(p.id);
  const unk=(p.name==='Unknown'||!p.name);
  let h='<button class="pcardrow'+(arch?' arch':'')+'" data-detail="'+p.id+'"><span class="accent" style="background:'+p.color+'"></span>';
  h+='<div class="hd"><span class="favstar'+(p.fav?' on':'')+'" data-fav="'+p.id+'">'+(p.fav?'★':'☆')+'</span><span class="snum">'+(p.lastSeat?'S'+p.lastSeat:'-')+'</span><span class="nm"'+(unk?' style="color:var(--dim)"':'')+'>'+esc(p.name||'Unknown')+'</span>';
  if(p.sex||p.age)h+='<span class="bio">'+esc([p.sex,p.age].filter(Boolean).join(' '))+'</span>';
  h+='<span class="tagmini">'+(arch?'離席':'Seat '+(p.lastSeat||'-')+' · '+fmtN(stackOf(p))+'('+bbOf(stackOf(p))+'BB)')+'</span></div>';
  h+='<div class="statline g8">'
    +cell(st.vpip+'%','VPIP',vpC(st.vpip,38,55))
    +cell(st.pfr+'%','PFR',vpC(st.pfr,22,35))
    +cell(st.threeb+'%','3B',vpC(st.threeb,8,13))
    +cell(st.fto3==null?'–':st.fto3+'%','Fto3',st.fto3==null?'':vpC(st.fto3,45,70))
    +cell(st.flopcb==null?'–':st.flopcb+'%','FlpCB',st.flopcb==null?'':vpC(st.flopcb,50,75))
    +cell(st.afRaw?'('+st.af+')':st.af.toFixed(1),'AF','')
    +cell(st.wtsd+'%','WTSD','')
    +cell(st.dealt,'N','')+'</div>';
  if(p.notes)h+='<div class="note-prev">'+esc(p.notes.length>62?p.notes.slice(0,62)+'…':p.notes)+'</div>';
  h+='</button>';return h;
}
function cell(v,k,c){return '<div class="stat"><div class="v '+c+'">'+v+'</div><div class="k">'+k+'</div></div>';}
function vpC(v,lo,hi){return v>=hi?'hot':(v<=lo?'cool':'warm');}

/* ----- DETAIL ----- */
function renderDetail(){
  const p=S.players[S.ui.detail];if(!p){S.ui.detail=null;return renderAnalysis();}
  const st=computeStats(p.id);
  const seated=occupiedSeats().map(playerOf).some(x=>x&&x.id===p.id);
  const shownHands=[];
  for(const h of S.hands){const hp=handSeatOf(h,p.id);if(hp&&hp.shown&&(hp.shown.cards.length||hp.shown.mystery))shownHands.push({h,sh:hp.shown});}
  let html='<div class="detail-hd"><button class="back" id="backAnalysis">‹</button><div style="flex:1"><h2 style="margin:0">'+esc(p.name||'Unknown')+'</h2><div class="muted" style="font-size:.66rem;font-family:var(--mono);margin-top:1px">Seat '+(p.lastSeat||'-')+(seated?'（着席中）':'（離席）')+(p.sex||p.age?' · '+[p.sex,p.age].filter(Boolean).join(' '):'')+'</div></div><button class="btn ghost sm" id="editP">編集</button></div>';
  html+='<div class="bigstats">'
    +big(st.vpip+'%','VPIP',vpC(st.vpip,38,55))+big(st.pfr+'%','PFR',vpC(st.pfr,22,35))+big(st.threeb+'%','3-BET',vpC(st.threeb,8,13))
    +big(st.fto3==null?'–':st.fto3+'%','Fto3',st.fto3==null?'':vpC(st.fto3,45,70))
    +big(st.flopcb==null?'–':st.flopcb+'%','Flop CB',st.flopcb==null?'':vpC(st.flopcb,50,75))
    +big(st.afRaw?'('+st.af+')':st.af.toFixed(1),'AF',st.af>=3?'hot':'')
    +big(st.wtsd+'%','WTSD','')+big(st.dealt,'ハンド','')+'</div>';
  html+='<div class="panel"><h3>チップ '+(seated?'（着席中）':'（離席）')+'</h3>'
    +'<div style="display:flex;align-items:center;gap:12px"><div style="font-family:var(--mono);font-size:1.6rem;font-weight:700">'+fmtN(stackOf(p))+'<span style="font-size:.9rem;color:var(--green)"> ('+bbOf(stackOf(p))+'BB)</span></div>'
    +'<button class="btn sm" id="editChips" style="margin-left:auto">修正</button></div>'
    +'<div class="muted" style="font-size:.7rem;margin-top:7px">ハンド保存時にポット結果から自動増減します。ズレたら手動修正できます。</div></div>';
  html+='<div class="panel"><h3>傾向メモ</h3><textarea class="notes" id="pnotes" placeholder="例: 3betに弱い / リバーのオーバーベットはナッツ / ショートでルースにオールイン…">'+esc(p.notes||'')+'</textarea></div>';
  html+='<div class="panel"><h3>見せたハンド ('+shownHands.length+')'+(st.muck?' · マック '+st.muck:'')+'</h3>';
  if(shownHands.length===0)html+='<div class="muted" style="font-size:.8rem">まだ記録がありません。</div>';
  else for(const{h,sh}of shownHands){
    html+='<div class="shown-row"><div class="cc" style="display:flex;gap:4px">';
    if(sh.mystery)html+=cardHTML('?',true);else for(const c of sh.cards)html+=cardHTML(c,true);
    html+='</div><div class="meta">'+(sh.note?esc(sh.note):'<span class="muted">メモなし</span>')
      +'<div class="when">'+fmtDate(h.ts)+([...h.board.flop,...h.board.turn,...h.board.river].length?' · '+[...h.board.flop,...h.board.turn,...h.board.river].join(' '):'')+'</div></div></div>';
  }
  html+='</div>';
  html+='<button class="btn danger block" id="delP">このプレイヤーを完全に削除</button>';
  view.innerHTML=html;
}
function big(v,k,c){return '<div class="bigstat"><div class="v '+c+'">'+v+'</div><div class="k">'+k+'</div></div>';}
function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})+' '+d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});}

/* ----- HISTORY ----- */
function renderHistory(){
  let h='<div class="section-h"><h2>ハンド履歴</h2>'+(S.hands.length?'<span class="muted" style="font-size:.76rem">'+S.hands.length+' ハンド</span>':'')+'</div>';
  const ps=Object.values(S.players);
  if(ps.length){
    h+='<div class="chips" style="margin-bottom:13px"><button class="chip" data-filter="" style="'+(!S.ui.filter?'background:var(--gold);color:#1a1306;border-color:var(--gold)':'')+'">全員</button>';
    for(const p of ps)h+='<button class="chip" data-filter="'+p.id+'" style="'+(S.ui.filter===p.id?'background:'+p.color+';color:#1a1306;border-color:'+p.color:'')+'">'+esc(p.name)+'</button>';
    h+='</div>';
  }
  let hands=S.hands;
  if(S.ui.filter)hands=hands.filter(x=>!!handSeatOf(x,S.ui.filter));
  if(hands.length===0)h+='<div class="empty-note">記録されたハンドはまだありません。</div>';
  else for(const hd of hands)h+=histRowHTML(hd);
  view.innerHTML=h;
}
function histRowHTML(hd){
  const board=[...hd.board.flop,...hd.board.turn,...hd.board.river];
  const pot=hd.pot!=null?hd.pot:potOfHand(hd);
  const sdItems=[];
  for(const s in hd.seats){const hp=hd.seats[s];const p=S.players[hp.playerId];if(!p)continue;
    if(hp.shown&&(hp.shown.cards.length||hp.shown.mystery||hp.shown.muck))sdItems.push({p,sh:hp.shown,won:hd.winners&&hd.winners.includes(+s)});}
  let h='<button class="histrow" data-hand="'+hd.id+'"><div class="top"><span class="when">'+fmtDate(hd.ts)+' · Lv'+(hd.level||'-')+'</span>'+(pot>0?'<span class="pot">POT '+fmtN(pot)+'</span>':'')+'</div>';
  if(board.length){h+='<div class="board-mini">';for(const c of board)h+=cardHTML(c,true);h+='</div>';}
  if(sdItems.length){h+='<div class="sd">';for(const{p,sh,won}of sdItems){
    h+='<div class="sd-item"><span class="who" style="color:'+p.color+'">'+esc(p.name)+'</span><span class="cc">';
    if(sh.muck)h+=cardHTML('muck',true);else if(sh.mystery)h+=cardHTML('?',true);else for(const c of sh.cards)h+=cardHTML(c,true);
    h+='</span>'+(won?'<span class="wn">WON</span>':'')+(sh.note?'<span class="muted" style="font-size:.68rem;font-style:italic">'+esc(sh.note)+'</span>':'')+'</div>';
  }h+='</div>';}else h+='<div class="muted" style="font-size:.76rem">ショーダウン記録なし</div>';
  if(hd.note)h+='<div class="note-line">'+esc(hd.note)+'</div>';
  h+='</button>';return h;
}

/* ============ overlays ============ */
function overlay(html,center){const o=document.createElement('div');o.className='overlay'+(center?' center':'');o.innerHTML='<div class="sheet">'+(center?'':'<div class="grip"></div>')+html+'</div>';o.addEventListener('click',e=>{if(e.target===o)o.remove();});document.body.appendChild(o);return o;}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600);}
function confirmSheet(msg,onYes,yesLabel){
  let h='<div class="sh-hd"><h3>確認</h3><button class="close">×</button></div>';
  h+='<div style="font-size:.9rem;line-height:1.7;margin-bottom:16px">'+esc(msg)+'</div>';
  h+='<button class="btn danger block" id="cfYes">'+esc(yesLabel||'実行する')+'</button>';
  h+='<button class="btn ghost block" id="cfNo" style="margin-top:8px">キャンセル</button>';
  const o=overlay(h,true);
  $('.close',o).onclick=()=>o.remove();
  $('#cfNo',o).onclick=()=>o.remove();
  $('#cfYes',o).onclick=()=>{o.remove();onYes&&onYes();};
}

  });
}

/* ===== 順繰り入力フロー ===== */
function recordAction(seatN,key,a,amt){
  const hp=S.draft.seats[seatN];if(!hp)return;
  const e={a,amt:(amt===''||amt==null)?null:+amt};
  hp[key].push(e);
  S.draft.seq[key].push({s:seatN,a,amt:e.amt});
  if(a==='fold')hp.folded=true;else hp.folded=false;
}
function clearSeatStreet(seatN,key){
  const hp=S.draft.seats[seatN];if(!hp)return;
  hp[key]=hp[key].filter(x=>x.a==='blind'||x.a==='ante');
  S.draft.seq[key]=S.draft.seq[key].filter(e=>!(e.s===seatN&&e.a!=='blind'&&e.a!=='ante'));
  hp.folded=false;
}
function curKey(){return STREETS.find(s=>s[0]===S.ui.street)[1];}
// このストリートの場の状態（各自の拠出額・現在ベット額・アグレッション回数）
function streetState(){
  const key=curKey();const seq=(S.draft&&S.draft.seq[key])||[];
  const committed={};let currentBet=0,aggr=0;
  for(const e of seq){
    const inc=+e.amt||0;committed[e.s]=(committed[e.s]||0)+inc;
    if(['bet','raise','threebet','fourbet','blind'].includes(e.a))currentBet=Math.max(currentBet,committed[e.s]);
    if(['bet','raise','threebet','fourbet'].includes(e.a))aggr++;
  }
  return{committed,currentBet,aggr};
}
function classifyAgg(){ // 現在の場から、次のアグレッシブアクションの種別を決定
  const ss=streetState();
  if(S.ui.street==='preflop'){const n=ss.aggr+1;return n<=1?'raise':(n===2?'threebet':'fourbet');}
  return ss.currentBet===0?'bet':'raise';
}
// 場の最低ベット額。プリフロップはBBを下限とし、全員チェックを防ぐ
function standingBet(){const cb=streetState().currentBet;return S.ui.street==='preflop'?Math.max(cb,+S.settings.bb||0):cb;}
// ラウンド完了判定: 残りアクティブ全員が自発アクション済み かつ 拠出が場のベットに揃っている
function roundComplete(){
  if(S.ui.street==='showdown')return false;
  const active=activeOrder();if(active.length<=1)return true;
  const key=curKey();const ss=streetState();const standing=standingBet();
  for(const s of active){
    const acted=S.draft.seq[key].some(e=>e.s===s&&e.a!=='blind'&&e.a!=='ante');
    if(!acted)return false;
    if((ss.committed[s]||0)!==standing)return false;
  }
  return true;
}
function openActionFlow(seatN){
  let forceInput=(seatN!=null);
  if(seatN!=null)S.draft.actor=seatN;
  if(S.draft.actor==null||!activeOrder().includes(S.draft.actor))S.draft.actor=firstActor();
  const o=overlay('<div id="flowBody"></div>');
  const close=()=>{o.remove();render();};
  const draw=()=>{
    const stIdx=STREETS.findIndex(s=>s[0]===S.ui.street);const key=curKey();
    const active=activeOrder();
    const force=forceInput;forceInput=false; // 1回の描画でのみ有効（無限ループ防止）
    // ハンド終了（残り1人）
    if(active.length<=1&&!force){
      const w=active[0];const wp=w?playerOf(w):null;
      let h='<div class="sh-hd"><h3>ハンド終了</h3><button class="close">×</button></div>';
      h+='<div class="flow-done"><div class="big">残り1人</div>'+(wp?'<div class="who">'+esc(wp.name||'Unknown')+'（Seat '+w+'）がポット獲得</div>':'')+'<div class="pot">POT '+fmtN(potOfDraft(S.draft))+'</div></div>';
      h+='<button class="btn gold block" id="winSave">▶ このプレイヤーの勝ちで保存</button>';
      h+='<button class="btn ghost block" id="toSdEnd" style="margin-top:8px">ショーダウンを記録してから保存</button>';
      h+='<button class="btn ghost block" id="backEdit" style="margin-top:8px">← 修正する</button>';
      $('#flowBody',o).innerHTML=h;
      $('.close',o).onclick=close;
      $('#winSave',o).onclick=()=>{if(w){S.draft.winners=[w];}o.remove();finalizeHand();};
      $('#toSdEnd',o).onclick=()=>{o.remove();startShowdownFlow();};
      $('#backEdit',o).onclick=()=>{forceInput=true;const seq=S.draft.seq[key];S.draft.actor=(seq.length?seq[seq.length-1].s:firstActor());draw();render();};
      return;
    }
    // ラウンド完了
    if(roundComplete()&&!force){
      const last=stIdx>=3;
      let h='<div class="sh-hd"><h3>ラウンド完了</h3><button class="close">×</button></div>';
      h+='<div class="flow-done"><div class="big">'+STREETS[stIdx][2]+' 完了</div><div class="who">全員のアクションが揃いました</div><div class="pot">POT '+fmtN(potOfDraft(S.draft))+'</div></div>';
      if(!last)h+='<button class="btn gold block" id="nextStreet">▶ '+STREETS[stIdx+1][2]+'のカード登録へ</button>';
      else h+='<button class="btn gold block" id="toSD">▶ ショーダウン登録へ</button>';
      h+='<button class="btn ghost block" id="backEdit" style="margin-top:8px">← 修正する</button>';
      h+='<button class="btn ghost block" id="closeFlow" style="margin-top:8px">グリッドに戻る</button>';
      $('#flowBody',o).innerHTML=h;
      $('.close',o).onclick=close;$('#closeFlow',o).onclick=close;
      const ns=$('#nextStreet',o);if(ns)ns.onclick=()=>{o.remove();advanceToStreet(STREETS[stIdx+1][0]);};
      const sd=$('#toSD',o);if(sd)sd.onclick=()=>{o.remove();startShowdownFlow();};
      $('#backEdit',o).onclick=()=>{forceInput=true;const seq=S.draft.seq[key];S.draft.actor=(seq.filter(e=>e.a!=='blind'&&e.a!=='ante').slice(-1)[0]||{}).s||firstActor();draw();render();};
      return;
    }
    // 通常のアクター入力
    if(!activeOrder().includes(S.draft.actor))S.draft.actor=firstActor();
    const seatN2=S.draft.actor;const p=playerOf(seatN2);const hp=S.draft.seats[seatN2];
    const pm=positionMap();const pos=pm[seatN2]||'';
    const ss=streetState();const committed=ss.committed[seatN2]||0;
    const standing=standingBet();const toCall=Math.max(0,standing-committed);
    const bb=+S.settings.bb||200;
    const order=activeOrder();const oi=order.indexOf(seatN2);
    const bio=[p.name||'Unknown',p.sex,p.age].filter(Boolean).join(' ');
    let h='<div class="sh-hd"><h3>Seat '+seatN2+(pos?' · '+pos:'')+' <span class="muted" style="font-size:.74rem">/ '+esc(bio)+'</span></h3><button class="close">×</button></div>';
    h+='<div class="flow-prog">'+STREETS[stIdx][2]+' ・ '+(oi+1)+'/'+order.length+' 人目</div>';
    h+='<div class="flow-info">場 <b>'+fmtN(standing)+'</b>'+(committed?'（あなた '+fmtN(committed)+'）':'')+' ／ コール <b>'+fmtN(toCall)+'</b> ／ POT '+fmtN(potOfDraft(S.draft))+'</div>';
    const cur=streetActs(hp,key).filter(x=>x.a!=='blind'&&x.a!=='ante');
    if(cur.length){
      h+='<div class="flow-cur">';
      for(const a of cur)h+='<span class="tag '+a.a+'">'+actTag(a.a)+(a.amt?' '+fmtN(a.amt):'')+'</span>';
      h+=' <button class="mini-clear" id="clr">消す</button></div>';
    }
    h+='<div class="amt-label">ベット/レイズ額（このストリートの合計・直接入力可）</div>';
    h+='<input class="amtdisp" id="amtD" type="number" inputmode="numeric" placeholder="0"><div class="chips" id="chips"></div>';
    const raiseLabel=(standing===0)?'ベット':'レイズ';
    h+='<div class="actgrid2">';
    if(toCall>0){
      h+='<button class="actbtn call" id="aCall">コール<span class="en">+'+fmtN(toCall)+'</span></button>';
      h+='<button class="actbtn raise" id="aRaise">'+raiseLabel+'<span class="en">額を入力</span></button>';
    }else{
      h+='<button class="actbtn check" id="aCheck">チェック<span class="en">Check</span></button>';
      h+='<button class="actbtn bet" id="aRaise">'+raiseLabel+'<span class="en">額を入力</span></button>';
    }
    h+='<button class="actbtn fold" id="aFold">フォールド<span class="en">Fold</span></button>';
    h+='</div>';
    h+='<div class="flow-nav"><button class="btn sm ghost" id="prevP">← 戻る</button><button class="btn sm" id="closeFlow">グリッド</button></div>';
    $('#flowBody',o).innerHTML=h;
    const amtEl=$('#amtD',o);
    const cont=$('#chips',o);
    [2,2.5,3,4,5,10].forEach(m=>{const b=document.createElement('button');b.className='chip';b.textContent=(m%1?m.toFixed(1):m)+'BB';b.onclick=()=>{amtEl.value=Math.round(bb*m);};cont.appendChild(b);});
    const allin=document.createElement('button');allin.className='chip';allin.style.color='var(--red)';allin.textContent='ALL-IN';allin.onclick=()=>{amtEl.value=committed+stackOf(p);};cont.appendChild(allin);
    const bc=document.createElement('button');bc.className='chip clear';bc.textContent='C';bc.onclick=()=>{amtEl.value='';};cont.appendChild(bc);
    const advance=()=>{forceInput=false;const nx=nextActor(seatN2);save();if(nx!=null)S.draft.actor=nx;draw();render();};
    const aCall=$('#aCall',o);if(aCall)aCall.onclick=()=>{recordAction(seatN2,key,'call',toCall);advance();};
    const aCheck=$('#aCheck',o);if(aCheck)aCheck.onclick=()=>{recordAction(seatN2,key,'check',null);advance();};
    $('#aRaise',o).onclick=()=>{
      const to=+amtEl.value||0;const cb=standing;
      if(to<=cb){toast('場（'+fmtN(cb)+'）より大きい合計額を入力');return;}
      const inc=to-committed;if(inc<=0){toast('額を入力してください');return;}
      recordAction(seatN2,key,classifyAgg(),inc);advance();
    };
    $('#aFold',o).onclick=()=>{recordAction(seatN2,key,'fold',null);advance();};
    const clrB=$('#clr',o);if(clrB)clrB.onclick=()=>{clearSeatStreet(seatN2,key);forceInput=true;save();draw();render();};
    $('#prevP',o).onclick=()=>{forceInput=true;S.draft.actor=prevActor(seatN2);draw();render();};
    $('#closeFlow',o).onclick=close;
    $('.close',o).onclick=close;
  };
  draw();
}

/* 次ストリートへ: カード登録→ベット入力 */
function advanceToStreet(nextKey){
  S.ui.street=nextKey;S.draft.actor=firstActor();render();
  const part=nextKey==='flop'?['フロップ','flop',3]:nextKey==='turn'?['ターン','turn',1]:nextKey==='river'?['リバー','river',1]:null;
  if(part)openBoardEntry(part[0],part[1],part[2],()=>openActionFlow());
  else openActionFlow();
}
/* ボードカード登録シート */
function openBoardEntry(label,boardKey,max,onDone){
  const d=S.draft;d.board[boardKey]=d.board[boardKey]||[];
  const o=overlay('<div id="beBody"></div>');
  const draw=()=>{
    const arr=d.board[boardKey];
    const before=boardKey==='flop'?[]:boardKey==='turn'?[...d.board.flop]:[...d.board.flop,...d.board.turn];
    let h='<div class="sh-hd"><h3>'+label+'のカード登録</h3><button class="close">×</button></div>';
    if(before.length){h+='<div class="be-prev">これまで：';for(const c of before)h+=cardHTML(c,true);h+='</div>';}
    h+='<div class="muted" style="font-size:.72rem;margin-bottom:8px">'+arr.length+' / '+max+' 枚</div>';
    h+='<div class="picked" id="bePick"></div>';
    h+='<div style="display:flex;gap:8px"><button class="btn sm" id="beAdd"'+(arr.length>=max?' disabled style="opacity:.4"':'')+' style="flex:1;justify-content:center">＋ カードを選ぶ</button>'
      +'<button class="btn sm" id="beClr" style="flex:1;justify-content:center">クリア</button></div>';
    h+='<button class="btn gold block" id="beDone" style="margin-top:12px"'+(arr.length<max?' disabled style="opacity:.4"':'')+'>▶ '+label+'のベット入力へ</button>';
    h+='<button class="btn ghost block" id="beSkip" style="margin-top:8px">カードを入れずに進む</button>';
    $('#beBody',o).innerHTML=h;
    $('#bePick',o).innerHTML=arr.length?arr.map(c=>cardHTML(c)).join(''):'<span class="muted">未選択</span>';
    const addB=$('#beAdd',o);if(addB&&arr.length<max){
      if(max>1)addB.innerHTML='＋ 残り'+(max-arr.length)+'枚を選ぶ';
      const pickNext=()=>{ if(arr.length>=max){draw();render();return;}
        openCardPicker(c=>{arr.push(c);save();draw();if(arr.length<max)pickNext();else render();},usedCards(-1)); };
      addB.onclick=pickNext;
    }
    $('#beClr',o).onclick=()=>{d.board[boardKey]=[];save();draw();render();};
    $('.close',o).onclick=()=>{o.remove();render();};
    $('#beSkip',o).onclick=()=>{o.remove();onDone&&onDone();};
    const dn=$('#beDone',o);if(dn&&arr.length>=max)dn.onclick=()=>{o.remove();onDone&&onDone();};
  };
  draw();
}
/* ショーダウン: 降りていない各プレイヤーを順に登録（マック可） */
function startShowdownFlow(){
  S.ui.street='showdown';render();
  const queue=actionOrder().filter(s=>{const hp=S.draft.seats[s];return hp&&!hp.folded;});
  const step=(i)=>{
    if(i>=queue.length){render();toast('ショーダウン登録完了 → 保存できます');return;}
    openShowdownSheet(queue[i],{idx:i,total:queue.length,onDone:()=>step(i+1)});
  };
  if(queue.length===0){render();return;}
  step(0);
}

      $('#addC',o).onclick=()=>openCardPicker(c=>{if(!cards.includes(c)&&cards.length<5){cards.push(c);draw();}},usedCards(seatN));

function usedCards(exceptSeat){
  const used=[];const d=S.draft;
  used.push(...d.board.flop,...d.board.turn,...d.board.river);
  for(const s in d.seats){if(+s===exceptSeat)continue;const sh=d.seats[s].shown;if(sh&&sh.cards)used.push(...sh.cards);}
  return used;
}

/* start hand */
function startHand(){
  const occ=occupiedSeats();if(occ.length<2)return;
  if(S.hands.length>0||S._dealt)S.buttonSeat=nextOccAfter(S.buttonSeat);
  else if(!occ.includes(S.buttonSeat))S.buttonSeat=occ[0];
  S._dealt=true;
  const seats={};const seq={pf:[],fl:[],tn:[],rv:[]};
  for(const n of occ)seats[n]={playerId:seatObj(n).playerId,pf:[],fl:[],tn:[],rv:[],folded:false,shown:{cards:[],mystery:false,muck:false,note:''}};
  if(S.settings.autoBlind){
    const{sb,bb}=blindSeats();
    if(sb&&seats[sb]){seats[sb].pf.push({a:'blind',amt:+S.settings.sb||0});seq.pf.push({s:sb,a:'blind',amt:+S.settings.sb||0});}
    if(bb&&seats[bb]){seats[bb].pf.push({a:'blind',amt:+S.settings.bb||0});seq.pf.push({s:bb,a:'blind',amt:+S.settings.bb||0});}
    if(S.settings.ante>0&&bb&&seats[bb]){seats[bb].pf.push({a:'ante',amt:+S.settings.ante||0});seq.pf.push({s:bb,a:'ante',amt:+S.settings.ante||0});}
  }
  S.draft={id:uid(),ts:Date.now(),level:S.level,buttonSeat:S.buttonSeat,board:{flop:[],turn:[],river:[]},seats,seq,winners:[],note:''};
  S.ui.street='preflop';
  S.draft.actor=firstActor();
  save();render();
  if(S.draft.actor)openActionFlow();
}
/* 入力順序: PFはUTG(BBの次)から→…→SB→BB(最後)。ポストフロップはSB→…→BTN(最後)。降りた人は飛ばす */
function actionOrder(){
  const fb=orderFromButton();const n=fb.length;if(n<2)return [];
  if(S.ui.street==='preflop'){
    if(n===2)return [fb[0],fb[1]];           // HU: SB(=BTN)→BB
    return fb.slice(3).concat([fb[0],fb[1],fb[2]]); // UTG…CO, BTN, SB, BB(最後)
  }else{
    if(n===2)return [fb[1],fb[0]];           // HU postflop: BB→BTN
    return fb.slice(1).concat([fb[0]]);      // SB, BB, UTG…CO, BTN(最後)
  }
}
function activeOrder(){return actionOrder().filter(s=>{const hp=S.draft&&S.draft.seats[s];return hp&&!hp.folded;});}
function firstActor(){const ord=actionOrder();for(const s of ord){const hp=S.draft&&S.draft.seats[s];if(hp&&!hp.folded)return s;}return null;}
// 固定の全体順序を基準に、cur の「次／前」で降りていない席を返す（curが降りていてもOK）
function nextActor(cur){
  const ord=actionOrder();if(!ord.length)return null;
  let i=ord.indexOf(cur);if(i<0)i=0;
  for(let k=1;k<=ord.length;k++){const s=ord[(i+k)%ord.length];const hp=S.draft.seats[s];if(hp&&!hp.folded)return s;}
  return null;
}
function prevActor(cur){
  const ord=actionOrder();if(!ord.length)return null;
  let i=ord.indexOf(cur);if(i<0)i=0;
  for(let k=1;k<=ord.length;k++){const s=ord[(i-k+ord.length)%ord.length];const hp=S.draft.seats[s];if(hp&&!hp.folded)return s;}
  return null;
}

/* save hand — winner picker if pot>0 */
function commitHand(){
  const d=S.draft;if(!d)return;
  const pot=potOfDraft(d);
  const contenders=Object.keys(d.seats).map(Number).filter(s=>!d.seats[s].folded);
  if(pot>0&&(!d.winners||d.winners.length===0)&&contenders.length>=1){openWinnerPicker();return;}
  finalizeHand();
}
function openWinnerPicker(){
  const d=S.draft;const pot=potOfDraft(d);
  const contenders=Object.keys(d.seats).map(Number).filter(s=>!d.seats[s].folded);
  let sel=(d.winners&&d.winners.length)?d.winners.slice():[];
  let h='<div class="sh-hd"><h3>ポット獲得者</h3><button class="close">×</button></div>';
  h+='<div class="muted" style="font-size:.78rem;margin-bottom:11px">POT '+fmtN(pot)+' を獲得した席を選択（複数=スプリット）。チップ自動集計に使います。</div>';
  h+='<div class="winpick" id="wp"></div>';
  h+='<button class="btn gold block" id="wSave">確定して保存</button>';
  h+='<button class="btn ghost block" id="wSkip" style="margin-top:8px">獲得者不明で保存（チップ集計しない）</button>';
  const o=overlay(h);
  const draw=()=>{let x='';for(const s of contenders){const p=S.players[d.seats[s].playerId];const inv=investedInDraft(d,s);
    x+='<div class="winrow'+(sel.includes(s)?' sel':'')+'" data-w="'+s+'"><span class="dot" style="background:'+(p?p.color:'#888')+'"></span><span class="nm">'+(p?esc(p.name):'Seat '+s)+'</span><span class="inv">投資 '+fmtN(inv)+'</span><span class="chk">'+(sel.includes(s)?'✓':'')+'</span></div>';}
    $('#wp',o).innerHTML=x;
    o.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const s=+b.dataset.w;if(sel.includes(s))sel=sel.filter(x=>x!==s);else sel.push(s);draw();});};
  draw();
  $('.close',o).onclick=()=>o.remove();
  $('#wSave',o).onclick=()=>{if(sel.length===0){toast('獲得者を選んでください');return;}d.winners=sel;o.remove();finalizeHand();};
  $('#wSkip',o).onclick=()=>{d.winners=[];o.remove();finalizeHand(true);};
}
function finalizeHand(skipChips){
  const d=S.draft;const pot=potOfDraft(d);
  d.pot=pot;
  d.deltas={};
  if(!skipChips&&d.winners&&d.winners.length){
    const share=Math.floor(pot/d.winners.length);
    for(const s in d.seats){const inv=investedInDraft(d,+s);const won=d.winners.includes(+s)?share:0;const delta=won-inv;d.deltas[s]=delta;const p=S.players[d.seats[s].playerId];if(p)p.stack=stackOf(p)+delta;}
  }
  S.hands.unshift(d);S.draft=null;save();render();toast('ハンド #'+S.hands.length+' を保存 ✓');
}

/* hand detail */
function openHandDetail(hid){
  const hd=S.hands.find(x=>x.id===hid);if(!hd)return;
  let h='<div class="sh-hd"><h3>ハンド詳細 <span class="muted" style="font-size:.78rem">Lv'+(hd.level||'-')+'</span></h3><button class="close">×</button></div>';
  const board=[...hd.board.flop,...hd.board.turn,...hd.board.river];
  if(board.length){h+='<div style="display:flex;gap:6px;margin-bottom:6px;justify-content:center">';for(const c of board)h+=cardHTML(c);h+='</div>';}
  h+='<div class="muted" style="text-align:center;font-family:var(--mono);font-size:.72rem;margin-bottom:12px">POT '+fmtN(hd.pot!=null?hd.pot:potOfHand(hd))+'</div>';
  const seatNums=Object.keys(hd.seats).map(Number).sort((a,b)=>a-b);
  for(const s of seatNums){const hp=hd.seats[s];const p=S.players[hp.playerId];
    const allActs=[];for(const[,key,,short]of STREETS){if(key==='sd')continue;const a=streetActs(hp,key).filter(x=>x.a!=='blind'&&x.a!=='ante');if(a.length)allActs.push(short+': '+a.map(x=>actTag(x.a)+(x.amt?' '+fmtN(x.amt):'')).join(', '));}
    const sh=hp.shown;const hasSh=sh&&(sh.cards.length||sh.mystery||sh.muck);
    if(allActs.length===0&&!hasSh)continue;
    const won=hd.winners&&hd.winners.includes(s);
    h+='<div style="padding:9px 0;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:center;gap:7px;margin-bottom:4px"><span style="width:8px;height:8px;border-radius:50%;background:'+(p?p.color:'#888')+'"></span><b>'+(p?esc(p.name):'Seat '+s)+'</b>'+(won?'<span class="wn" style="font-size:.55rem">WON</span>':'');
    if(hasSh){h+='<span style="margin-left:auto;display:flex;gap:3px">';if(sh.muck)h+=cardHTML('muck',true);else if(sh.mystery)h+=cardHTML('?',true);else for(const c of sh.cards)h+=cardHTML(c,true);h+='</span>';}
    h+='</div>';if(allActs.length)h+='<div class="muted" style="font-size:.72rem;font-family:var(--mono)">'+allActs.join('　/　')+'</div>';
    if(hasSh&&sh.note)h+='<div class="muted" style="font-size:.72rem;font-style:italic;margin-top:3px">"'+esc(sh.note)+'"</div>';h+='</div>';}
  h+='<div class="field" style="margin-top:12px"><label>ハンドメモ</label><textarea id="hdNote" class="notes" style="min-height:46px">'+esc(hd.note||'')+'</textarea></div>';
  h+='<button class="btn danger block" id="hdDel">このハンドを削除</button>';
  const o=overlay(h);
  $('.close',o).onclick=()=>o.remove();
  $('#hdNote',o).oninput=function(){hd.note=this.value;save();};
  $('#hdDel',o).onclick=()=>{confirmSheet('このハンドを削除しますか？（チップへの増減も取り消されます）',()=>{if(hd.deltas)for(const s in hd.deltas){const p=S.players[hd.seats[s].playerId];if(p)p.stack=stackOf(p)-hd.deltas[s];}S.hands=S.hands.filter(x=>x.id!==hid);save();o.remove();render();},'削除する');};
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const t=e.target;
  const nav=t.closest('#nav button');if(nav){S.ui.tab=nav.dataset.tab;S.ui.detail=null;save();render();return;}
  if(t.closest('#moveBtn')){openTableMove();return;}
  if(t.closest('#blindBtn')){openBlindEditor();return;}
  if(t.closest('#tableInfo')){openBlindEditor();return;}
  if(t.closest('#startHand')){startHand();return;}
  if(t.closest('#commitHand')||t.closest('#commitHand2')){commitHand();return;}
  if(t.closest('#cancelHand')){confirmSheet('記録中のハンドを破棄しますか？',()=>{S.draft=null;save();render();},'破棄する');return;}
  const stb=t.closest('[data-street]');if(stb){S.ui.street=stb.dataset.street;if(S.draft)S.draft.actor=firstActor();render();return;}
  if(t.closest('#editBoard')){openBoardEditor();return;}
  // dealer button controls (manage view)
  const setb=t.closest('[data-setbtn]');if(setb){S.buttonSeat=+setb.dataset.setbtn;save();render();return;}
  const bmv=t.closest('[data-btnmove]');if(bmv){S.buttonSeat=bmv.dataset.btnmove==='next'?nextOccAfter(S.buttonSeat):prevOccBefore(S.buttonSeat);save();render();return;}
  if(t.closest('#resumeFlow')){openActionFlow();return;}
  const seat=t.closest('[data-seat]');if(seat){
    const n=+seat.dataset.seat;const mode=seat.dataset.mode;const p=playerOf(n);
    if(mode==='manage'){p?openSeatMenu(n):openSeatAdd(n);}
    else if(mode==='showdown'){if(p)openShowdownSheet(n);}
    else if(mode==='hand'){if(p)openActionFlow(n);}
    return;
  }
  const favb=t.closest('[data-fav]');if(favb){const pid=favb.dataset.fav;if(S.players[pid]){S.players[pid].fav=!S.players[pid].fav;save();render();}return;}
  if(t.closest('#bulkDelArch')){
    const seatedIds=occupiedSeats().map(playerOf).filter(Boolean).map(p=>p.id);
    const targets=Object.values(S.players).filter(p=>!seatedIds.includes(p.id)&&!p.fav&&!p.hero);
    if(targets.length)confirmSheet('お気に入り(★)以外の過去プレイヤー '+targets.length+'人を削除します。よろしいですか？',()=>{for(const p of targets)delete S.players[p.id];save();render();toast(targets.length+'人を削除しました');},'削除する');
    return;
  }
  const det=t.closest('[data-detail]');if(det){S.ui.tab='analysis';S.ui.detail=det.dataset.detail;render();return;}
  if(t.closest('#backAnalysis')){S.ui.detail=null;render();return;}
  if(t.closest('#editP')){openPlayerEditor(S.ui.detail);return;}
  if(t.closest('#editChips')){openChipEditor(S.ui.detail);return;}
  if(t.closest('#delP')){confirmSheet('このプレイヤーの記録をすべて削除しますか？',()=>{const pid=S.ui.detail;for(const s of S.seats)if(s.playerId===pid)s.playerId=null;delete S.players[pid];S.ui.detail=null;save();render();},'削除する');return;}
  if(t.closest('#toggleArch')){S.ui.showArch=!S.ui.showArch;render();return;}
  const sortb=t.closest('[data-sort]');if(sortb){S.ui.sort=sortb.dataset.sort;render();return;}
  const fil=t.closest('[data-filter]');if(fil){S.ui.filter=fil.dataset.filter||null;render();return;}
  const hand=t.closest('[data-hand]');if(hand){openHandDetail(hand.dataset.hand);return;}
  // data tab
  if(t.closest('#swAuto')){S.settings.autoBlind=!S.settings.autoBlind;save();render();return;}
  if(t.closest('#startT')){const id=uid();S.tournaments.push({id,name:'トーナメント '+(S.tournaments.length+1),date:new Date().toLocaleDateString('ja-JP'),entrants:'',active:'',itm:''});S.activeTournament=id;save();render();return;}
  if(t.closest('#endT')){S.activeTournament=null;save();render();toast('トーナメントの記録を完了しました');return;}
  const dtour=t.closest('[data-deltour]');if(dtour){const tid=dtour.dataset.deltour;const tn=S.tournaments.find(x=>x.id===tid);confirmSheet('「'+esc(tn?tn.name:'')+'」を削除しますか？',()=>{S.tournaments=S.tournaments.filter(x=>x.id!==tid);if(S.activeTournament===tid)S.activeTournament=null;save();render();},'削除する');return;}
  if(t.closest('#expData')){exportData();return;}
  if(t.closest('#impData')){importData();return;}
  if(t.closest('#resetData')){confirmSheet('全データを削除してリセットします。よろしいですか？',()=>{S=blank();ensureSeats();save();render();},'リセットする');return;}
});
document.addEventListener('input',e=>{
  const id=e.target.id,v=e.target.value;
  if(id==='startStackInput'){S.settings.startStack=Math.max(0,+v||0);const f=$('#setStart');if(f)f.value=S.settings.startStack;save();return;}
  if(id==='pnotes'&&S.ui.detail){S.players[S.ui.detail].notes=v;save();return;}
  const st=S.settings;
  if(id==='setSb'){st.sb=+v||0;save();}
  if(id==='setBb'){st.bb=+v||0;save();render();}
  if(id==='setAnte'){st.ante=+v||0;save();}
  if(id==='setStart'){st.startStack=+v||0;const f=$('#startStackInput');if(f&&document.activeElement!==f)f.value=st.startStack;save();}
  if(id==='setSeatCount'){st.seatCount=+v;ensureSeats();if(st.heroSeat>st.seatCount)st.heroSeat=null;save();render();}
  if(id==='setHero'){st.heroSeat=v?+v:null;save();render();}
  const tt=S.tournaments.find(x=>x.id===S.activeTournament);
  if(tt){if(id==='tName')tt.name=v;if(id==='tEntrants')tt.entrants=v;if(id==='tActive')tt.active=v;if(id==='tItm')tt.itm=v;if(['tName','tEntrants','tActive','tItm'].includes(id))save();}
});

/* export/import */
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='poker-notes-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('書き出しました');}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&d.players&&d.seats){S=Object.assign(blank(),d);ensureSeats();S.ui=Object.assign(blank().ui,{tab:'data'});save();render();toast('読み込みました ✓');}else alert('形式が正しくありません');}catch(err){alert('読み込みに失敗しました');}};r.readAsText(f);};inp.click();}

(async function(){await load();render();})();
</script>
